<!doctype html>
<html lang="cs" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IFC VR</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./src/ebc/ebc-tokens.css">
  <link rel="stylesheet" href="./src/ebc/ebc-components.css">
  <link rel="stylesheet" href="./src/app.css">
</head>
<body class="ebc">
  <div id="viewport" class="viewport ebc-surface-tech"></div>

  <aside class="side" id="side">
    <header class="side__head">
      <h1 class="ebc-app-title"><span class="ebc-app-title__accent">ifc</span>.vr</h1>
      <button class="ebc-icon-btn side__collapse" id="btn-collapse" title="Sbalit panel" aria-expanded="true">
        <svg class="ebc-icon"><use href="./ebc/ebc-icons.svg#ebc-icon-chevron-up"/></svg>
      </button>
    </header>

    <div class="side__body" id="side-body">
      <label class="ebc-dropzone side__drop" id="drop">
        <input type="file" id="file" accept=".ifc" multiple hidden>
        <span class="ebc-dropzone__progress" id="drop-progress" style="width:0"></span>
        <svg class="ebc-icon ebc-dropzone__icon" id="drop-icon"><use href="./ebc/ebc-icons.svg#ebc-icon-ifc"/></svg>
        <span class="ebc-dropzone__title" id="drop-title">Přetáhněte soubory IFC sem</span>
        <span class="ebc-dropzone__hint">nebo vyberte kliknutím – i více najednou</span>
      </label>

      <section class="side__section side__progress" id="progress-sec" hidden aria-live="polite">
        <div class="side__progress-head"><span class="side__progress-name" id="progress-name"></span><span class="ebc-small side__count" id="progress-count"></span></div>
        <p class="ebc-small side__progress-phase" id="progress-phase"></p>
      </section>

      <section class="side__section" id="loaded-sec" hidden>
        <h2 class="ebc-group-label">Načtené modely <span class="side__count" id="loaded-count"></span></h2>
        <ul class="ebc-list ebc-list--accent model-list" id="loaded"></ul>
      </section>

      <section class="side__section" id="models-sec" hidden>
        <h2 class="ebc-group-label">Modely ve složce models</h2>
        <ul class="ebc-list ebc-list--accent model-list" id="models"></ul>
      </section>

      <p class="ebc-small side__status" id="status" aria-live="polite"></p>

      <div class="side__actions">
        <button class="ebc-btn" id="btn-ar" disabled>Vstoupit do AR</button>
        <button class="ebc-btn ebc-btn--primary" id="btn-vr" disabled>Vstoupit do VR</button>
      </div>

      <details class="ebc-expander" id="info-sec" open>
        <summary class="ebc-expander__header"><span>Vybraný prvek</span><span class="ebc-expander__summary" id="info-summary"></span></summary>
        <div class="ebc-expander__body" id="info"><p class="ebc-small ebc-caption">Klikněte na prvek v modelu.</p></div>
      </details>

      <details class="ebc-expander">
        <summary class="ebc-expander__header"><span>Ovládání ve VR</span><span class="ebc-expander__summary">Meta Quest 3</span></summary>
        <div class="ebc-expander__body">
          <div class="ebc-table-wrap"><table class="ebc-table"><tbody id="help"></tbody></table></div>
        </div>
      </details>

      <p class="ebc-small side__contact" id="cache-line" hidden><span id="cache-text"></span> <a class="ebc-link" href="#" role="button" id="cache-clear">Vymazat mezipaměť</a></p>
      <p class="ebc-small side__contact" id="perf" hidden></p>
      <p class="ebc-small side__contact" id="gpu" hidden></p>
      <p class="ebc-small side__contact">Autor: Lukáš Hovorka · <a class="ebc-link" href="mailto:lukas.hovorka@energy-benefit.cz">lukas.hovorka@energy-benefit.cz</a></p>
    </div>
  </aside>

  <!-- nabídka barvy modelu -->
  <div class="ebc-menu color-menu" id="color-menu" role="menu" aria-label="Barva modelu" hidden>
    <p class="ebc-small color-menu__label">Barva modelu</p>
    <div class="color-menu__palette" id="color-palette"></div>
    <div class="ebc-menu__sep"></div>
    <button class="ebc-menu__item" data-act="custom" role="menuitemradio"><span class="model__color"></span><span>Vlastní barva…</span><span></span></button>
    <button class="ebc-menu__item" data-act="orig" role="menuitemradio"><span class="model__color is-original"></span><span>Původní barvy z IFC</span><span></span></button>
  </div>
  <input type="color" class="color-input" id="color-input" tabindex="-1" aria-hidden="true">

  <script type="module" src="./src/main.js"></script>
</body>
</html>
